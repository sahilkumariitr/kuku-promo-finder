name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (synthetic fixture, includes LLM path against a local fake API)
        run: pytest -q
      - name: Smoke run (rules backend)
        run: promo-finder --input tests/fixtures/synthetic_show --out /tmp/out --backend rules
