# Copy to config.toml and pass with --config config.toml. Every key is optional.

# --- model (any OpenAI-compatible endpoint) ---
provider = "gemini"          # gemini | groq | openrouter | openai | ollama
# model = "gemini-3.8-flash" # leave unset for the provider default
# base_url = "https://my-company-gateway/v1/"   # point at Kuku's own API to swap in a stronger model
# api_key_env = "MY_KEY_VAR"
temperature = 0.3
montages = 5                 # cross-episode promos (0 = off)
montage_shared_cast = true   # every cut in a montage must keep a named character from the previous segment
cold_read = true             # +1 request: a reader with no show context rates whether each montage is followable
cold_read_min = 3            # montages it rates below this (1-5) are dropped; 1 = flag only, never drop
episodes_per_call = 10       # free tiers cap requests/day: batch episodes into one request
# min_interval = 13.0        # seconds between requests; default comes from the provider (Gemini free: 13)
# fallback_models = ["gemini-3.6-flash", "gemini-3.5-flash-lite"]   # tried when the main model fails
cache = true                 # reuse finished requests when a run is repeated (resume after a stop)
rules_fallback = true        # episodes the LLM fails on get the rules backend's best pick

# --- promo rules from the brief ---
min_len = 20.0
max_len = 60.0
hook_window = 3.0

# --- ranking ---
w_hook = 0.40
w_cliff = 0.35
w_standalone = 0.25
w_llm = 0.7                  # how much the LLM's judgement counts vs the rule features
funnel_bonus = 0.05          # prefer promos from early episodes (viewer lands on ep 1)
funnel_max_ep = 10
low_confidence = 0.65
